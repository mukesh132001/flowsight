name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (SQLite engine, small scale)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: End-to-end build + tests (data quality, leakage, guardrails, reports)
        run: pytest -v

  spark-parity:
    name: Same SQL on Spark (parity with SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-spark.txt
      - name: Generate small dataset
        run: PYTHONPATH=src python -m flowsight generate --scale small
      - name: Build every model on SQLite and Spark and compare all tables
        run: PYTHONPATH=src python -m flowsight parity --scale small
